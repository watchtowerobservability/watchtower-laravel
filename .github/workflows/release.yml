name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      # Composer resolves from the git tag; GitHub Packages has no Composer registry.
      - run: git archive --format=zip --prefix=watchtower-laravel/ -o "watchtower-laravel-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'watchtower-laravel-*.zip'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" watchtower-laravel-*.zip --generate-notes --verify-tag
